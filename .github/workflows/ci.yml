name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: PSScriptAnalyzer & Pester Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path .\GpuGameGuard.ps1 -Severity Warning, Error -Recurse
          if ($results) {
              $results | Format-Table -AutoSize
              $errors = $results | Where-Object { $_.Severity -eq 'Error' }
              if ($errors) { exit 1 }
          }

      - name: Validate Script Parsing
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(".\GpuGameGuard.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
          Write-Host "PowerShell script syntax validated successfully."

      - name: Run Pester Unit Tests
        shell: pwsh
        run: |
          # Unpinned, this pulls whatever Pester is newest, and the v3/v4 test
          # syntax this repo used broke silently the day the runner moved to
          # Pester 6. Stay inside one major.
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser `
            -MinimumVersion 6.0.0 -MaximumVersion 6.999.999
          # -CI makes a failing run set the exit code instead of just printing.
          Invoke-Pester -Path .\tests\GpuGameGuard.Tests.ps1 -Output Detailed -CI
